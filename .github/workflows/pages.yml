name: Deploy Fourier Web
on:
  push:
    branches: [main, verify-browser-release]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    uses: ./.github/workflows/rust.yml
  build:
    # Playwright 1.51.1 supports Ubuntu 24.04; pin the runner to avoid OS drift.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build web --target web --release --out-dir site/pkg
      - run: test -s web/site/pkg/fourier_web_bg.wasm && test -s web/site/pkg/fourier_web.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix web/tests --no-audit --no-fund
      - run: web/tests/node_modules/.bin/playwright install --with-deps chromium
      - run: node web/tests/browser.mjs
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            browser-verified.png
            browser-failure.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    needs: [build, native-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  promote-verified:
    # Only this dedicated release branch is allowed to auto-promote after every test passes.
    if: github.ref == 'refs/heads/verify-browser-release' && github.event_name == 'push'
    needs: [build, native-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote verified commit without overwriting main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/main
      - name: Dispatch production deployment of verified main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
