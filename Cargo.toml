[package]
name = "fourier-transformer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
rfd = "0.15"
rustfft = "6.2"
image = { version = "0.25", default-features = false, features = ["png","jpeg","bmp"] }
imageproc = { version = "0.25", default-features = false }
ttf-parser = "0.25"
fontdb = "0.23"
serde_json = "1"

[profile.release]
lto = "thin"
