[package]
name = "fourier-web"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
fourier-transformer = { path = ".." }
wasm-bindgen = "0.2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png","jpeg","bmp","webp"] }
[profile.release]
lto = "thin"
